name: L5 Engineering Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
      - name: Static and security checks
        run: |
          ruff check api/main.py api/test_api.py src/pipelines/etl.py tests/test_etl.py benchmarks/pipeline_benchmark.py
          bandit -q api/main.py src/pipelines/etl.py benchmarks/pipeline_benchmark.py
      - name: Tests and coverage
        run: |
          pytest tests api/test_api.py             --cov=src.pipelines.etl --cov=api.main             --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Reproducible benchmark smoke test
        run: |
          python -m benchmarks.pipeline_benchmark --rows 10000 --repeats 3 --output benchmark.json
          python -c "import json; d=json.load(open('benchmark.json')); assert d['metrics']['output_rows']==10000"
      - name: Audit API dependencies
        run: pip-audit --requirement api/requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-and-coverage
          path: |
            benchmark.json
            coverage.xml

  deployment-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          docker build --target api -t nyc-finance-api:ci .
          docker build --target etl -t nyc-finance-etl:ci .
          docker build --target dashboard -t nyc-finance-dashboard:ci .
      - name: Verify non-root API image
        run: test "$(docker image inspect nyc-finance-api:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke test API
        run: |
          docker run -d --rm --name nyc-finance-api-ci -p 8000:8000 nyc-finance-api:ci
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs nyc-finance-api-ci
          exit 1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate Kubernetes offline
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.7.0             -strict -summary -kubernetes-version 1.31.0 /work/infra/k8s
