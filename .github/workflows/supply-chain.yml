name: Supply Chain

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "api/**"
      - "requirements/**"
      - "api/requirements.txt"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build API image
        run: docker build --target api -t "$IMAGE:${GITHUB_SHA}" .
      - name: Scan HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: api-sbom
          path: sbom.spdx.json
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:${GITHUB_REF_NAME}"
      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3
      - name: Sign release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "$IMAGE:${GITHUB_REF_NAME}"
