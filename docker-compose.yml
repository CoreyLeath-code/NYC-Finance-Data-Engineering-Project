services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nyc_finance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_user} -d ${POSTGRES_DB:-nyc_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      MODEL_PATH: /app/models/model.pkl
    ports:
      - "8000:8000"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    environment:
      PROCESSED_DATA_PATH: /app/data/processed/nyc_finance_processed.csv
    volumes:
      - ./data/processed:/app/data/processed:ro
    ports:
      - "8501:8501"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  etl:
    build:
      context: .
      target: etl
    environment:
      RAW_DATA_PATH: /app/data/raw/nyc_finance_synthetic.csv
      PROCESSED_DATA_PATH: /app/data/processed/nyc_finance_processed.csv
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["pipeline"]

volumes:
  pgdata:
